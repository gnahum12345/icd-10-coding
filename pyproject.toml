[project]
name = "icd10-prediction"
version = "0.1.0"
description = "ICD10 code extraction from medical transcripts using LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "lxml>=4.9.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3.0",
    "plotly>=5.0.0",
    "tiktoken>=0.5.0",
]
